name: Deploy Pages

# Replaces the legacy Jekyll-based Pages build, which repeatedly hung/errored
# (2026-07-04). Deploys the repo root as-is on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # Explicit ref: a dispatched run pins its checkout SHA when the run is
      # *created*, and the update-results dispatch can land before the just-pushed
      # commit is visible (2026-07-15: deployed the previous day's commit, site
      # stale for a day). `ref: main` makes checkout fetch main's current tip at
      # execution time instead of the pinned SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # The Pages backend intermittently rejects deployments with a transient
      # "Deployment failed, try again later" (both of the first two runs of this
      # workflow hit it on attempt 1), so retry once after a pause before failing.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
