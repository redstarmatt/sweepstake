name: Update results

on:
  schedule:
    # Every 3 hours at :37 (off-peak minute — on-the-hour slots are frequently delayed/dropped
    # by GitHub). 8 runs/day so a single missed slot is harmless and evening matches land same day.
    - cron: '37 */3 * * *'
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write
  actions: write   # lets the job dispatch the Deploy Pages workflow after pushing

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull latest results into index.html
        run: node scripts/update-results.mjs

      - name: Commit & push if changed
        id: commit
        run: |
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git config user.name "sweepstake-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Auto-update results ($(date -u +%Y-%m-%d))"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Pushed updated results."
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — nothing to commit."
          fi

      # Pushes made with GITHUB_TOKEN never fire `on: push` workflows (GitHub's
      # recursion guard), so the Pages deploy must be dispatched explicitly —
      # otherwise the site stays stale even though main has the new scores.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
